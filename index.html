<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meu treino</title>
  <meta name="description" content="Timer de descanso e de intervalos, rotinas de treino com cargas e controle de peso. Funciona sem internet.">
  <meta name="theme-color" content="#0d1613">
  <meta name="color-scheme" content="dark light">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Meu treino">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="css/style.css">

  <!-- Aplica o tema salvo antes da primeira pintura, para a tela não "piscar". -->
  <script>
    (function () {
      try {
        var d = JSON.parse(localStorage.getItem('treino:v2'));
        var t = d && d.config && d.config.tema;
        var claro = t === 'claro' || (t !== 'escuro' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.setAttribute('data-tema', claro ? 'claro' : 'escuro');
      } catch (e) { /* mantém o tema escuro padrão */ }
    })();
  </script>
</head>
<body>
  <noscript><p class="aviso-noscript">O Meu treino precisa de JavaScript para funcionar. Ative-o no navegador e recarregue a página.</p></noscript>

  <main class="app" id="conteudo">
    <section class="aba" id="aba-timer" hidden></section>
    <section class="aba" id="aba-treinos" hidden></section>
    <section class="aba" id="aba-peso" hidden></section>
    <section class="aba" id="aba-ajustes" hidden></section>
  </main>

  <button type="button" id="mini-timer" class="mini-timer" hidden></button>
  <nav id="navegacao" class="navegacao" aria-label="Seções do app"></nav>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <p id="anuncios" class="so-leitor" role="status" aria-live="polite"></p>

  <script type="module" src="js/app.js"></script>
</body>
</html>
